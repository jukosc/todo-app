name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
  preflight:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact reviewed released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read-only hosted cluster preflight
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TRAINING_KUBE_CONFIG: ${{ secrets.TRAINING_KUBE_JUKO_2182572F }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          umask 077
          config="$RUNNER_TEMP/training-preflight-kubeconfig.json"
          trap 'rm -f "$config"' EXIT
          python3 - <<'PYCONFIG'
          import os,json
          from pathlib import Path
          raw=os.environ.pop('TRAINING_KUBE_CONFIG')
          if len(raw.encode())>131072:raise SystemExit('CI config bound exceeded')
          json.loads(raw)
          path=Path(os.environ['RUNNER_TEMP'])/'training-preflight-kubeconfig.json'
          with path.open('x') as handle:handle.write(raw)
          path.chmod(0o600)
          PYCONFIG
          unset TRAINING_KUBE_CONFIG
          python3 .github/scripts/deploy_release.py --config "$config" --binding .github/scripts/day5-binding.json --version "${GITHUB_REF_NAME#v}" --ci-hosted --preflight-only
  publish:
    needs: [quality, preflight]
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      statuses: write
    env:
      TRAINING_IMAGE: ${{ vars.TRAINING_IMAGE }}
    steps:
      - name: Validate fixed nonsecret image variable
        shell: bash
        run: test "$TRAINING_IMAGE" = "ghcr.io/${GITHUB_REPOSITORY,,}"
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize Buildx
        uses: docker/setup-buildx-action@v3
      - name: Reject existing registry release tag
        shell: bash
        run: |
          node --input-type=module -e 'const image=process.env.TRAINING_IMAGE.replace(/^ghcr\.io\//, "");const tag=process.env.GITHUB_REF_NAME;if(!/^v1\.0\.1-day5\.(s[0-9]{8}|[a-f0-9]{8})$/.test(tag))throw new Error("Invalid training release tag");const response=await fetch("https://ghcr.io/token?service=ghcr.io&scope="+encodeURIComponent("repository:"+image+":pull"),{redirect:"error",signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error("Anonymous registry check failed");const auth=await response.json();if(typeof auth.token!=="string")throw new Error("Invalid anonymous registry response");const manifest=await fetch("https://ghcr.io/v2/"+image+"/manifests/"+tag,{headers:{Authorization:"Bearer "+auth.token,Accept:"application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"},redirect:"error",signal:AbortSignal.timeout(15000)});if(manifest.status!==404)throw new Error("Release tag exists or absence was not proven");'
      - name: GHCR login with scoped job token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact release tag
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ vars.TRAINING_IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Record authoritative pushed manifest digest
        uses: actions/github-script@v7
        env:
          PUSHED_DIGEST: ${{ steps.publish.outputs.digest }}
        with:
          script: |
            const digest = process.env.PUSHED_DIGEST;
            if (!/^sha256:[0-9a-f]{64}$/.test(digest)) throw new Error('Invalid pushed digest');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: context.sha, state: 'success', context: 'training/release-digest',
              description: digest,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
  deploy:
    needs: [quality, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact reviewed released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify public registry manifest against pushed digest
        shell: bash
        env:
          PUSHED_DIGEST: ${{ needs.publish.outputs.digest }}
          TRAINING_IMAGE: ${{ vars.TRAINING_IMAGE }}
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const image=process.env.TRAINING_IMAGE;
          if(image!==`ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`)throw new Error('Image variable invalid');
          const expected=process.env.PUSHED_DIGEST;
          if(!/^sha256:[0-9a-f]{64}$/.test(expected))throw new Error('Pushed digest invalid');
          const repo=image.substring(8);
          const tokenReply=await fetch('https://ghcr.io/token?service=ghcr.io&scope='+encodeURIComponent('repository:'+repo+':pull'),{redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!tokenReply.ok)throw new Error('Anonymous registry failed');
          const {token}=await tokenReply.json();
          const reply=await fetch('https://ghcr.io/v2/'+repo+'/manifests/'+process.env.GITHUB_REF_NAME,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json'},redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!reply.ok)throw new Error('Published manifest missing');
          const bytes=Buffer.from(await reply.arrayBuffer());
          if(bytes.length>1048576||reply.headers.get('docker-content-digest')!==expected||'sha256:'+createHash('sha256').update(bytes).digest('hex')!==expected)throw new Error('Published digest mismatch');
          console.log('Published manifest verified before deployment');
          NODE
      - name: Deploy verified digest with limited CI identity
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          TRAINING_KUBE_CONFIG: ${{ secrets.TRAINING_KUBE_JUKO_2182572F }}
          PUSHED_DIGEST: ${{ needs.publish.outputs.digest }}
          TRAINING_IMAGE: ${{ vars.TRAINING_IMAGE }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          umask 077
          config="$RUNNER_TEMP/training-ci-kubeconfig.json"
          trap 'rm -f "$config"' EXIT
          python3 - <<'PYCONFIG'
          import os,json
          from pathlib import Path
          raw=os.environ.pop('TRAINING_KUBE_CONFIG')
          if len(raw.encode())>131072:raise SystemExit('CI config bound exceeded')
          parsed=json.loads(raw)
          path=Path(os.environ['RUNNER_TEMP'])/'training-ci-kubeconfig.json'
          with path.open('x') as handle:handle.write(raw)
          path.chmod(0o600)
          PYCONFIG
          unset TRAINING_KUBE_CONFIG
          version="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/deploy_release.py --config "$config" --binding .github/scripts/day5-binding.json --image "$TRAINING_IMAGE@$PUSHED_DIGEST" --version "$version" --exercise-recovery --ci-hosted
